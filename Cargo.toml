[package]
name = "callibri-app"
version = "0.1.0"
edition = "2024"

[features]
wayland = ["enigo/wayland"]

[build-dependencies]
bindgen = "0.72.1"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
iced = { version = "0.13", features = ["wgpu", "system", "tokio"] }
enigo = { version = "0.6.1", features = ["wayland"] }
